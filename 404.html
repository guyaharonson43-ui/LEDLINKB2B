<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEDLink — דף לא נמצא</title>
    <!-- SEO: prevent indexing of this error page -->
    <meta name="robots" content="noindex, nofollow">
    <!-- Canonical fallback to homepage -->
    <link rel="canonical" href="https://ledlink.co.il/">
  <script>
    // Smart redirect — route old/broken URLs to the correct page
    (function () {
      var path = window.location.pathname;
      var pathLower = path.toLowerCase();
      var search = window.location.search || '';
      var dest;

      // ── Exact matches for known stale Google-indexed URLs ──────────────────
      var EXACT = {
        '/product/magnetic-linear-rotate': '/catalog.html',
        '/product/1715':                   '/catalog.html',
        '/product/meanwell-60w-ip67':      '/catalog.html',
        '/product/%D7%9E%D7%97%D7%91%D7%A8-%D7%99%D7%A9%D7%A8': '/catalog.html',
        '/product/מחבר-ישר':              '/catalog.html',

        // Old WordPress-era datasheet PDFs → same file, new location.
        // Confirmed 1:1 (identical filename still present under /datasheets/):
        '/wp-content/uploads/2022/10/N2412L.pdf': '/datasheets/N2412L.pdf',
        '/wp-content/uploads/2022/10/PUL.pdf':    '/datasheets/PUL.pdf',
        '/wp-content/uploads/2022/10/SLBOX.pdf':  '/datasheets/SLBOX.pdf',
        '/wp-content/uploads/2022/10/SLBOXD.pdf': '/datasheets/SLBOXD.pdf',
        // Confirmed by naming convention (I = IP68, A = IP65, 1103 replaces 1102):
        '/wp-content/uploads/2022/10/H24I.pdf':     '/datasheets/H24_IP68.pdf',
        '/wp-content/uploads/2022/10/B24A.pdf':     '/datasheets/B24_IP65.pdf',
        '/wp-content/uploads/2022/10/DALI1102.pdf': '/datasheets/DALI1103.pdf',
        // Confirmed via product qlt-3d2460's known datasheet mapping:
        '/wp-content/uploads/2022/10/3D2460.pdf':   '/datasheets/DS_3D.pdf',
      };
      if (EXACT[path]) {
        window.location.replace(EXACT[path]);
        return;
      }

      // ── Pattern-based fallbacks ────────────────────────────────────────────
      // Catalog / product-related paths → catalog
      if (/catalog|product|strip|profile|driver|led|profil/.test(pathLower)) {
        dest = '/catalog.html' + search;
      }
      // Tool / guide pages
      else if (/tool|guide|calc|מחשב/.test(pathLower)) {
        dest = '/tools.html';
      }
      // About / FAQ / legal
      else if (/about|faq|privacy|takanon|access/.test(pathLower)) {
        dest = '/' + pathLower.split('/').filter(Boolean).pop();
      }
      // Anything else (discontinued products/files, /shop/, unrecognized paths)
      // has no real destination — redirecting it to the homepage/catalog anyway
      // reads to search engines as a "soft 404" (a broken URL that quietly
      // resolves to live content). Leave it as a genuine not-found page instead.
      else {
        dest = null;
      }

      // Matched cases redirect immediately (before the page is read); unmatched
      // cases leave the static "not found" message below as-is — also serves
      // JS-disabled clients and crawlers that don't execute redirects.
      if (dest) {
        window.location.replace(dest);
      }
    })();
  </script>
  <style>
    body { font-family: 'Heebo', sans-serif; direction: rtl; text-align: center;
           padding: 60px 20px; background: #F4F4F0; color: #333; }
    a { color: #E8A020; }
  </style>
</head>
<body>
  <p>
    הדף שחיפשת לא קיים באתר.<br>
    <a href="/">חזרה לדף הבית</a> | <a href="/catalog.html">קטלוג מוצרים</a>
  </p>
</body>
</html>
