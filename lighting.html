<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קטלוג גופי תאורה — LEDLink</title>
<meta name="description" content="קטלוג גופי תאורה מקצועי — פסי צבירה, ספוטים ושקועים, בקרה וחיישנים. LEDLink רחובות.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lighting-tokens.css">
<link rel="stylesheet" href="lighting-kit.css">
<style>
  /* ---- two-level grouping ---- */
  .ig-group { max-width: var(--container); margin: 0 auto; }
  .ig-group + .ig-group { margin-top: 40px; }
  .ig-group__label { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: var(--fg3); margin-bottom: 16px; display: flex; align-items: center; gap: 14px; }
  .ig-group__label::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .ig-tabwrap { display: flex; gap: 36px; flex-wrap: wrap; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
  .ig-tabgroup { display: flex; flex-direction: column; gap: 0; }
  .ig-tabgroup__label { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: var(--fg-muted); padding: 0 16px 2px; }
  .ig-tabs { border-bottom: 0; margin-bottom: 0; }
  @media(max-width: 920px) { .ig-tabwrap { gap: 18px; } }

  /* ---- scroll-to-top ---- */
  #scrollTopBtn { position: fixed; bottom: 90px; inset-inline-start: 22px; z-index: 50;
    width: 46px; height: 46px; border-radius: 50%; background: var(--ink-850);
    border: 1px solid rgba(255,255,255,.14); color: #F6F2EA; cursor: pointer;
    display: none; place-items: center; box-shadow: 0 4px 16px rgba(0,0,0,.25);
    transition: transform .2s; }
  #scrollTopBtn.visible { display: grid; }
  #scrollTopBtn:hover { transform: translateY(-2px); }

  /* ---- fab ---- */
  .ll-fab { position: fixed; inset-inline-start: 22px; bottom: 22px; z-index: 50; display: flex; flex-direction: column; gap: 12px; }
  .ll-fab__wa { width: 56px; height: 56px; border-radius: 50%; background: #25D366; border: 0; color: #fff;
    cursor: pointer; display: grid; place-items: center; box-shadow: 0 4px 16px rgba(0,0,0,.3);
    text-decoration: none; transition: transform .2s; }
  .ll-fab__wa:hover { transform: translateY(-2px); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="lighting_data.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;
const WA = '97286326059';
const llcData = window.LL_CATALOG;

/* ---- enrich data with counts ---- */
llcData.cats.forEach((cat) => {
  cat.families.forEach((fam) => {
    fam.n = fam.sections.reduce((a, s) => a + s.products.length, 0);
  });
  cat.n = cat.families.reduce((a, f) => a + f.n, 0);
});

/* ---- manufacturing samples ---- */
const MFG_CATS = [
  { id: 'profiles', t: 'פרופילים', n: llcData.mfgCounts.profiles, d: 'פרופילי אלומיניום לסטריפ LED — ייצור לפי מידה, גוון וסגנון. תוך 24 שעות.' },
  { id: 'strip',    t: 'סטריפ LED', n: llcData.mfgCounts.strip,    d: 'White, COB, Neon, RGB, SPI. 12V / 24V / 48V. IP20 עד IP68.' },
  { id: 'drivers',  t: 'דרייברים',  n: llcData.mfgCounts.drivers,  d: 'ספקי מתח אירופאים. קבוע מתח (CV), קבוע זרם (CC). DALI, 0-10V, PWM.' },
];

const MFG_SAMPLES = {
  profiles: [
    { sku: 'PRF-2507', t: 'פרופיל שקוע צר',    specs: ['25×7mm','שקוע'], tone: 'ok',   stock: 'במלאי' },
    { sku: 'PRF-S45',  t: 'פרופיל פינתי 45°',  specs: ['פינה','תלוי'],  tone: 'ok',   stock: 'במלאי' },
    { sku: 'PRF-OUT',  t: 'פרופיל חוץ IP67',   specs: ['IP67','חוץ'],   tone: 'warn', stock: '24H ייצור' },
    { sku: 'PRF-W20',  t: 'פרופיל צמוד רחב',   specs: ['20mm','צמוד'],  tone: 'ok',   stock: 'במלאי' },
  ],
  strip: [
    { sku: 'STR-COB24', t: 'COB 24V 3000K',       specs: ['24V','CRI>90'], tone: 'ok',   stock: 'במלאי' },
    { sku: 'STR-RGB',   t: 'RGBW 24V',             specs: ['24V','RGBW'],  tone: 'ok',   stock: 'במלאי' },
    { sku: 'STR-N68',   t: 'Neon Flex IP68',       specs: ['24V','IP68'],  tone: 'warn', stock: '24H ייצור' },
    { sku: 'STR-SPI',   t: 'SPI Addressable',      specs: ['5V','SPI'],    tone: 'ok',   stock: 'במלאי' },
  ],
  drivers: [
    { sku: 'DRV-CV150', t: 'דרייבר CV 150W 24V',  specs: ['CV','150W'],   tone: 'ok',   stock: 'במלאי' },
    { sku: 'DRV-DALI',  t: 'דרייבר DALI עמעום',   specs: ['DALI','100W'], tone: 'ok',   stock: 'במלאי' },
    { sku: 'DRV-IP67',  t: 'דרייבר אטום IP67',    specs: ['CV','200W'],   tone: 'warn', stock: '24H ייצור' },
    { sku: 'DRV-010',   t: 'דרייבר 0-10V',         specs: ['0-10V','75W'], tone: 'ok',   stock: 'במלאי' },
  ],
};

const LLC_IMG  = 'https://www.eurolux.co.il/Media/Resize/250_250/';
const LLC_SHOW_PRICES = false;

const CAT_HERO = {
  profiles: 'assets/cat-profile.png',
  strip:    'assets/cat-strip.png',
  drivers:  LLC_IMG + 'led-driver250.jpg',
  track:    LLC_IMG + 'TK-94COB190(12).jpg',
  fixtures: LLC_IMG + 'D66-BK_NEW(6).jpg',
  control:  LLC_IMG + 'SD-T21-BK.webp',
};
const COVER_IMG = new Set(['strip']);

/* ---- primitives ---- */
function Logo({ light = false, size = 22 }) {
  return (
    <span className="ll-wm" style={{ fontSize: size, color: light ? '#F6F2EA' : 'var(--ink-900)' }}>
      <span style={{ color: 'var(--led-amber)' }}>LED</span>LINK
    </span>
  );
}

function Button({ children, variant = 'primary', onClick, href, as: As = 'button' }) {
  const cls = `ll-btn ll-btn--${variant}`;
  if (href) return <a className={cls} href={href}>{children}</a>;
  return <button className={cls} onClick={onClick}>{children}</button>;
}

function Badge({ children, tone = 'neutral' }) {
  return <span className={`ll-badge ll-badge--${tone}`}>{children}</span>;
}

function SpecChip({ children }) {
  return <span className="ll-spec">{children}</span>;
}

function Icon({ name, size = 20, stroke = 1.9 }) {
  const p = { width: size, height: size, viewBox: '0 0 24 24', fill: 'none',
    stroke: 'currentColor', strokeWidth: stroke, strokeLinecap: 'round', strokeLinejoin: 'round' };
  const paths = {
    phone:   <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z" />,
    pin:     <><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z" /><circle cx="12" cy="10" r="3" /></>,
    chat:    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />,
    clock:   <><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></>,
    shield:  <><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /><path d="m9 12 2 2 4-4" /></>,
    factory: <><path d="M2 20h20" /><path d="M4 20V9l5 3V9l5 3V9l5 3v8" /><path d="M9 20v-4h2v4" /></>,
    headset: <><path d="M3 14v-2a9 9 0 0 1 18 0v2" /><path d="M21 16a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 2zM3 16a2 2 0 0 0 2 2h1v-6H5a2 2 0 0 0-2 2z" /></>,
    arrow:   <path d="M19 12H5M12 5l-7 7 7 7" />,
    menu:    <><path d="M3 6h18M3 12h18M3 18h18" /></>,
    x:       <path d="M18 6 6 18M6 6l12 12" />,
    chevd:   <path d="m6 9 6 6 6-6" />,
    up:      <path d="m18 15-6-6-6 6" />,
    wa:      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />,
  };
  return <svg {...p} aria-hidden="true">{paths[name]}</svg>;
}

/* ---- Navbar ---- */
function Nav({ onNav, solid }) {
  const [catOpen, setCatOpen] = useState(false);
  const [mobile, setMobile] = useState(false);
  const [scrolled, setScrolled] = useState(false);
  const scrollEl = useRef(null);

  useEffect(() => {
    const el = document.querySelector('.kit-scroll');
    scrollEl.current = el;
    const handler = () => setScrolled((el ? el.scrollTop : window.scrollY) > 24);
    (el || window).addEventListener('scroll', handler);
    return () => (el || window).removeEventListener('scroll', handler);
  }, []);

  const catGroups = [
    { g: 'ייצור', items: MFG_CATS.map((c) => ({ id: c.id, t: c.t, n: c.n })) },
    { g: 'גופי תאורה', items: llcData.cats.map((c) => ({ id: c.id, t: c.t, n: c.n })) },
  ];

  return (
    <header className={`ll-nav ${scrolled || solid ? 'is-scrolled' : ''}`}>
      <div className="ll-nav__inner">
        <a className="ll-nav__brand" href="home.html"><Logo light size={22} /></a>

        <nav className="ll-nav__links">
          <div className="ll-nav__cat" onMouseEnter={() => setCatOpen(true)} onMouseLeave={() => setCatOpen(false)}>
            <button className="ll-nav__link">קטלוג מוצרים <Icon name="chevd" size={15} /></button>
            {catOpen && (
              <div className="ll-nav__menu ll-nav__menu--grouped">
                {catGroups.map((grp) => (
                  <div key={grp.g} className="ll-nav__menucol">
                    <div className="ll-nav__menulabel">{grp.g}</div>
                    {grp.items.map((c) => (
                      <a key={c.id} className="ll-nav__menuitem" href="#"
                        onClick={(e) => { e.preventDefault(); setCatOpen(false); onNav('catalog', c.id); }}>
                        <span>{c.t}</span>
                        {typeof c.n === 'number' ? <span className="ll-nav__menucount">{c.n}</span> : null}
                      </a>
                    ))}
                  </div>
                ))}
              </div>
            )}
          </div>
          <a className="ll-nav__link" href="tools.html">כלי תכנון</a>
          <a className="ll-nav__link" href="guides.html">מדריכים</a>
          <a className="ll-nav__link" href="about.html">אודות</a>
          <a className="ll-nav__link" href="#contact">צור קשר</a>
        </nav>

        <div className="ll-nav__right">
          <a className="ll-nav__login" href={`https://wa.me/${WA}`} target="_blank" rel="noopener">צור קשר <span className="bolt">⚡</span></a>
          <button className="ll-nav__burger" onClick={() => setMobile(true)} aria-label="תפריט"><Icon name="menu" /></button>
        </div>
      </div>

      {mobile && (
        <div className="ll-mobile">
          <div className="ll-mobile__bar">
            <Logo light size={20} />
            <button className="ll-mobile__close" onClick={() => setMobile(false)}><Icon name="x" /></button>
          </div>
          {catGroups.map((grp) => (
            <React.Fragment key={grp.g}>
              <div className="ll-mobile__group">{grp.g}</div>
              {grp.items.map((c) => (
                <a key={c.id} className="ll-mobile__link" href="#"
                  onClick={(e) => { e.preventDefault(); setMobile(false); onNav('catalog', c.id); }}>{c.t}</a>
              ))}
            </React.Fragment>
          ))}
          <div className="ll-mobile__group">כלים ומידע</div>
          <a className="ll-mobile__link" href="tools.html">כלי תכנון</a>
          <a className="ll-mobile__link" href="guides.html">מדריכים</a>
          <a className="ll-mobile__link" href="about.html">אודות</a>
          <a className="ll-mobile__login" href={`https://wa.me/${WA}`} target="_blank" rel="noopener">WhatsApp ⚡</a>
        </div>
      )}
    </header>
  );
}

/* ---- Hero ---- */
function Hero({ onNav }) {
  const ticks = ['ייצור תוך שעות', 'דרייברים אירופאים', 'ייעוץ טכני ללא עלות', '15 שנות ניסיון'];
  const trust = ['ISO 9001:2015', 'שותף רשמי QLT איטליה', 'ייצור מקומי · רחובות', 'CE · RoHS מאושר', 'תמיכה טכנית ישירה'];
  return (
    <section className="ll-hero on-dark">
      <div className="ll-hero__bg" style={{ backgroundImage: 'url(assets/hero.png)' }} />
      <div className="ll-hero__scrim" />
      <div className="ll-hero__inner">
        <div className="ll-overline">פתרונות תאורה מקצועיים · רחובות</div>
        <h1 className="ll-hero__title">לא מפיצים — יצרנים.</h1>
        <p className="ll-hero__sub">
          מזמינים ישירות ממי שמייצר.<br />
          פרופילים, סטריפ LED ודרייברים — מלאי מדף מוכן לאיסוף.
        </p>
        <div className="ll-hero__ticks">
          {ticks.map((t) => <span key={t} className="ll-tick"><i /> {t}</span>)}
        </div>
        <div className="ll-hero__cta">
          <Button variant="primary" onClick={() => onNav('catalog')}>לצפייה בקטלוג <Icon name="arrow" size={17} /></Button>
          <Button variant="glass" href={`https://wa.me/${WA}`}>שלח הודעה</Button>
        </div>
      </div>
      <div className="ll-trust">
        {trust.map((t) => <span key={t} className="ll-trust__item">{t}</span>)}
      </div>
    </section>
  );
}

function StatStrip() {
  const stats = [
    ['15+', 'שנות ניסיון', 'בתחום רכיבי LED'],
    [String(llcData.grandTotal), 'מוצרים בקטלוג', 'ייצור + גופי תאורה'],

    ['100%', 'ישירות מהמפעל', 'ללא מתווכים — מחיר יצרן'],
  ];
  return (
    <section className="ll-stats">
      {stats.map(([n, t, s]) => (
        <div key={t} className="ll-stat">
          <div className="ll-stat__n">{n}</div>
          <div className="ll-stat__t">{t}</div>
          <div className="ll-stat__s">{s}</div>

}

    { i: 'clock',   t: 'ישיר מהמפעל', d: 'ללא מתווכים — מחיר יצרן על כל הקטלוג. חוסכים לך עלויות ומקצרים את שרשרת האספקה.' },

  return (

      <div className="ll-contact__cta">

/* ---- product cards ---- */
function LampGlyph({ size = 36 }) {
  return (

      <path d="M6 14h36v6H30v14h-6V20H6z" /><path d="M6 14l5-5h31l-5 5M42 14v6" opacity=".55" />

  strip: (

  ),
  drivers: (
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      <rect x="7" y="13" width="34" height="22" rx="3" />
      <path d="M25 19l-4 7h6l-4 7" />
      <path d="M11 13V9M37 13V9M11 35v4M37 35v4" opacity=".55" />
    </svg>
  ),
};

function CatPhoto({ it }) {
  const [failed, setFailed] = useState(false);
  const hero = CAT_HERO[it.id];
  const showImg = hero && !failed;
  return (
    <div className={`ll-domain__photo ${showImg ? 'll-domain__photo--product' : 'll-domain__photo--graphic'}`}>
      {showImg
        ? <img className={`ll-domain__pimg ${COVER_IMG.has(it.id) ? 'll-domain__pimg--cover' : ''}`}
            src={hero} alt={it.t} loading="lazy" onError={() => setFailed(true)} />
        : <span className="ll-domain__glyph">{MFG_ICON[it.id] || <LampGlyph size={56} />}</span>}
      <span className="ll-domain__count">{it.n} דגמים</span>
    </div>
  );
}

function MfgCard({ p }) {
  return (
    <div className="ll-pcard">
      <div className="ll-pcard__photo" style={{ backgroundImage: 'url(assets/hero.png)' }}>
        <Badge tone={p.tone}>{p.stock}</Badge>
      </div>
      <div className="ll-pcard__body">
        <span className="ll-pcard__sku">{p.sku}</span>
        <h3 className="ll-pcard__t">{p.t}</h3>
        <div className="ll-pcard__specs">{p.specs.map((s) => <SpecChip key={s}>{s}</SpecChip>)}</div>
        <a className="ll-pcard__cta" style={{ display: 'block', textAlign: 'center', textDecoration: 'none' }}
          href={`https://wa.me/${WA}?text=שלום, אני מעוניין בהצעת מחיר עבור ${p.sku} — ${p.t}`}
          target="_blank" rel="noopener">בקש הצעת מחיר ←</a>
      </div>
    </div>
  );
}

function RealCard({ p }) {
  const waText = `שלום, אני מעוניין בהצעת מחיר עבור ${p.sku} — ${p.t}`;
  return (
    <div className="ll-pcard ll-pcard--real">
      <div className={`ll-pcard__rphoto ${p.img ? '' : 'is-empty'}`}>
        {p.img ? <img src={p.img} alt={p.t} loading="lazy" /> : <LampGlyph />}
      </div>
      <div className="ll-pcard__body">
        <span className="ll-pcard__sku">{p.sku}</span>
        <h3 className="ll-pcard__t ll-pcard__t--clamp" title={p.t}>{p.t}</h3>
        {p.specs && p.specs.length > 0
          ? <div className="ll-pcard__specs">{p.specs.map((s) => <SpecChip key={s}>{s}</SpecChip>)}</div>
          : null}
        {LLC_SHOW_PRICES && typeof p.price === 'number'
          ? <div className="ll-pcard__buy">
              <span className="ll-pcard__price">₪{p.price % 1 === 0 ? p.price : p.price.toFixed(2)} <small>כולל מע"מ</small></span>
              <a className="ll-pcard__cta ll-pcard__cta--row" href={`https://wa.me/${WA}?text=${encodeURIComponent(waText)}`} target="_blank" rel="noopener">הצעת מחיר</a>
            </div>
          : <a className="ll-pcard__cta" style={{ display: 'block', textAlign: 'center', textDecoration: 'none' }}
              href={`https://wa.me/${WA}?text=${encodeURIComponent(waText)}`}
              target="_blank" rel="noopener">בקש הצעת מחיר ←</a>
        }
      </div>
    </div>
  );
}

/* ---- DomainsFull (homepage categories) ---- */
function DomainsFull({ onNav }) {
  const groups = [
    { g: 'ייצור', cats: MFG_CATS },
    { g: 'גופי תאורה', cats: llcData.cats },
  ];
  return (
    <section className="ll-sec ll-sec--paper" data-screen-label="domains-full">
      <div className="ll-sec__head">
        <div className="ll-overline">הקטלוג המקצועי</div>
        <h2 className="ll-sec__title">כל הפרויקט. מקום אחד.</h2>
        <p className="ll-sec__lead">מהפרופיל בייצור אישי ועד גוף התאורה המוגמר — מענה מלא לפרויקט תאורה מקצועי.</p>
      </div>
      {groups.map((grp) => (
        <div key={grp.g} className="ig-group">
          <div className="ig-group__label">{grp.g}</div>
          <div className="ll-domains">
            {grp.cats.map((it) => (
              <button key={it.id} className="ll-domain" onClick={() => onNav('catalog', it.id)}>
                <CatPhoto it={it} />
                <div className="ll-domain__body">
                  <h3 className="ll-domain__t">{it.t}</h3>
                  <p className="ll-domain__d">{it.d}</p>
                  <span className="ll-domain__link">צפייה בקטלוג <Icon name="arrow" size={15} /></span>
                </div>
              </button>
            ))}
          </div>
        </div>
      ))}
    </section>
  );
}

/* ---- CatalogFull (catalog screen) ---- */
function CatalogFull({ onNav, initialCat }) {
  const [cat, setCat] = useState(initialCat || 'profiles');
  const [fam, setFam] = useState('all');
  const [q, setQ] = useState('');

  const realCat = llcData.cats.find((c) => c.id === cat);
  const pick = (id) => { setCat(id); setFam('all'); };

  const index = useMemo(() => {
    const rows = [];
    MFG_CATS.forEach((c) => MFG_SAMPLES[c.id].forEach((p) => rows.push({ p, cat: c.t, mfg: true })));
    llcData.cats.forEach((c) => c.families.forEach((f) => f.sections.forEach((s) =>
      s.products.forEach((p) => rows.push({ p, cat: c.t, fam: f.t })))));
    return rows;
  }, []);

  const query = q.trim().toLowerCase();
  const results = query ? index.filter((r) => (r.p.t + ' ' + r.p.sku).toLowerCase().includes(query)) : null;

  const tabGroups = [
    { g: 'ייצור', cats: MFG_CATS },
    { g: 'גופי תאורה', cats: llcData.cats },
  ];

  const famsShown = realCat
    ? (fam === 'all' ? realCat.families : realCat.families.filter((f) => f.id === fam))
    : [];

  return (
    <div className="ll-catalog" data-screen-label="catalog-full">
      <div className="ll-catalog__bar">
        <button className="ll-back" onClick={() => onNav('home')}>
          <Icon name="arrow" size={16} /> חזרה
        </button>
        <h1 className="ll-catalog__title">קטלוג מוצרים</h1>
        <input
          className="igf-search" type="search" value={q} dir="rtl"
          placeholder={`חיפוש בקטלוג — שם או מק"ט…`}
          onChange={(e) => setQ(e.target.value)}
        />
        <span className="ll-catalog__total">{llcData.grandTotal} מוצרים · מענה מלא לפרויקט</span>
      </div>

      {results ? (
        <div data-screen-label="catalog-search-results">
          <div className="igf-results">
            {results.length
              ? `${results.length} תוצאות עבור „${q.trim()}"`
              : `לא נמצאו תוצאות עבור „${q.trim()}" — נסו מק"ט או שם דגם`}
          </div>
          <div className="ll-grid">
            {results.slice(0, 60).map((r) =>
              r.mfg ? <MfgCard key={r.p.sku} p={r.p} /> : <RealCard key={r.p.sku} p={r.p} />
            )}
          </div>
        </div>
      ) : (
        <React.Fragment>
          <div className="ig-tabwrap">
            {tabGroups.map((grp) => (
              <div key={grp.g} className="ig-tabgroup">
                <span className="ig-tabgroup__label">{grp.g}</span>
                <div className="ll-tabs ig-tabs">
                  {grp.cats.map((c) => (
                    <button key={c.id} className={`ll-tab ${cat === c.id ? 'is-active' : ''}`} onClick={() => pick(c.id)}>
                      {c.t} <span className="ll-tab__c">{c.n}</span>
                    </button>
                  ))}
                </div>
              </div>
            ))}
          </div>

          {realCat ? (
            <React.Fragment>
              <div className="igf-famrail">
                <button className={`igf-fam ${fam === 'all' ? 'is-on' : ''}`} onClick={() => setFam('all')}>
                  הכול <b>{realCat.n}</b>
                </button>
                {realCat.families.map((f) => (
                  <button key={f.id} className={`igf-fam ${fam === f.id ? 'is-on' : ''}`} onClick={() => setFam(f.id)}>
                    {f.t} <b>{f.n}</b>
                  </button>
                ))}
              </div>
              {famsShown.map((f) => (
                <section key={f.id} className="igf-famsec">
                  <h2 className="igf-famsec__t">{f.t} <span className="igf-famsec__n">{f.n} דגמים</span></h2>
                  {f.sections.map((sec, i) => (
                    <div key={sec.t || i} className="igf-sec">
                      {sec.t ? <div className="ig-group__label">{sec.t}</div> : null}
                      <div className="ll-grid">{sec.products.map((p) => <RealCard key={p.sku} p={p} />)}</div>
                    </div>
                  ))}
                </section>
              ))}
            </React.Fragment>
          ) : (
            <React.Fragment>
              <div className="igf-note">
                מדגם מייצג מקו הייצור — הקטלוג המלא כולל <b>{MFG_CATS.find((c) => c.id === cat).n} דגמים</b>.
                לקבלת מפרט מלא — <a href={`https://wa.me/${WA}`} target="_blank" rel="noopener"
                  style={{ color: 'var(--led-ember)', fontWeight: 700 }}>דברו איתנו בוואטסאפ</a>.
              </div>
              <div className="ll-grid">{MFG_SAMPLES[cat].map((p) => <MfgCard key={p.sku} p={p} />)}</div>
            </React.Fragment>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

/* ---- App ---- */
function App() {
  const [screen, setScreen] = useState('home');
  const [cat, setCat] = useState('profiles');
  const scrollRef = useRef(null);

  // URL param: ?cat=track opens catalog directly
  useEffect(() => {
    const p = new URLSearchParams(window.location.search);
    const c = p.get('cat');
    if (c) { setCat(c); setScreen('catalog'); }
  }, []);

  // scroll-to-top button
  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    const btn = document.getElementById('scrollTopBtn');
    const handler = () => btn && btn.classList.toggle('visible', el.scrollTop > 400);
    el.addEventListener('scroll', handler);
    return () => el.removeEventListener('scroll', handler);
  }, []);

  const nav = (s, c) => {
    setScreen(s);
    if (c) setCat(c);
    if (scrollRef.current) scrollRef.current.scrollTo({ top: 0, behavior: 'smooth' });
  };

  return (
    <div className="kit-scroll" ref={scrollRef}>
      <Nav onNav={nav} solid={screen !== 'home'} />
      {screen === 'home' ? (
        <main>
          <Hero onNav={nav} />
          <StatStrip />
          <DomainsFull onNav={nav} />
          <Why />
          <Contact />
          <Footer />
        </main>
      ) : (
        <main>
          <CatalogFull onNav={nav} initialCat={cat} />
          <Footer />
        </main>
      )}

      {/* WhatsApp FAB */}
      <a className="ll-fab__wa" style={{ position: 'fixed', insetInlineStart: 22, bottom: 22, zIndex: 50 }}
        href={`https://wa.me/${WA}`} target="_blank" rel="noopener" aria-label="WhatsApp">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z" />
        </svg>
      </a>

      {/* scroll to top */}
      <button id="scrollTopBtn" aria-label="חזור לראש הדף"
        onClick={() => scrollRef.current && scrollRef.current.scrollTo({ top: 0, behavior: 'smooth' })}>
        <Icon name="up" size={20} />
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
