name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # PRs מריצים בנייה בלבד, בלי דיפלוי — כדי שבילד שבור יתגלה לפני
  # המיזוג ולא על האתר החי.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # קבוצה לכל ref בנפרד: קודם כל ה-PRs חלקו את התור עם הדיפלוי ל-main
  # ויכלו לעכב אותו. דיפלויים של main עדיין מסתדרים בטור ולא נקטעים;
  # בנייה של PR כן נקטעת כשנדחפת גרסה חדשה יותר לאותו PR.
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy landing page to dist
        run: |
          cp landing.html dist/landing.html
          rsync -a --ignore-existing assets/ dist/assets/

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # בלי השורה הזו כל PR היה מדפלוי את עצמו לאתר החי.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
